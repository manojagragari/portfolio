services:
  - type: web
    name: manoj-portfolio-api
    runtime: python
    rootDir: backend/django-portfolio-api
    buildCommand: bash build.sh
    startCommand: gunicorn portfolio_api.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: manoj-portfolio-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://manojagrahari.me https://www.manojagrahari.me https://manoj-portfolio-web.onrender.com https://portfolio2-ochre-two.vercel.app https://portfolio2-git-main-manojagragaris-projects.vercel.app https://portfolio2-9bjytn8rx-manojagragaris-projects.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://.*\.vercel\.app$"
      - key: CSRF_TRUSTED_ORIGINS
        value: https://manojagrahari.me https://www.manojagrahari.me https://manoj-portfolio-web.onrender.com https://portfolio2-ochre-two.vercel.app https://portfolio2-git-main-manojagragaris-projects.vercel.app https://portfolio2-9bjytn8rx-manojagragaris-projects.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: LOAD_INITIAL_FIXTURES
        value: "False"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: ENABLE_MEDIA_CLEANUP
        value: "False"

  - type: web
    name: manoj-portfolio-web
    runtime: node
    rootDir: frontend/nextjs-portfolio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NEXT_PUBLIC_API_URL
        value: https://manoj-portfolio-api.onrender.com

